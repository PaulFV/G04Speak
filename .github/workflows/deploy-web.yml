name: Web-Version veröffentlichen

# Baut die Web-Fassung der App und stellt sie auf GitHub Pages bereit.
# Die native App fuer iOS und Android wird davon nicht beruehrt.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Veroeffentlichungen nicht abbrechen, aber auch nicht doppelt starten.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Web-Paket bauen
        run: npx expo export --platform web

      - name: Fuer GitHub Pages vorbereiten
        run: |
          # Ohne diese Datei ignoriert Pages den Ordner _expo/,
          # weil er mit einem Unterstrich beginnt.
          touch dist/.nojekyll
          # Die App faengt ihre Routen selbst ab. Damit ein direkter Aufruf
          # einer Unterseite nicht ins Leere laeuft, bekommt Pages dieselbe
          # Seite auch als Fehlerseite.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
